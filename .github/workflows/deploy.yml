name: Deploy on push

on:
  push:
    branches: [main]

jobs:
  deploy-thinkpad:
    runs-on: [self-hosted, thinkpad]
    steps:
      - name: Pull latest
        run: |
          cd /repo
          git fetch origin main
          git reset --hard origin/main
      - name: Fix ownership
        run: |
          sudo chown -R 1000:1000 /repo
      - name: Restart backend container
        run: |
          if docker ps --format '{{.Names}}' | grep -q '^tmi-attendance-cpu$'; then
            echo "Container running — restarting"
            docker compose -f /home/naval/face-attendance-edu/backend/docker-compose.cpu.yml restart
          else
            echo "Container not running — building and starting"
            docker compose -f /home/naval/face-attendance-edu/backend/docker-compose.cpu.yml up -d --build
          fi

  deploy-elitebook:
    runs-on: [self-hosted, elitebook]
    steps:
      - name: Pull latest
        run: |
          cd /repo
          git fetch origin main
          git reset --hard origin/main
      - name: Fix ownership
        run: |
          sudo chown -R 1000:1000 /repo
      - name: Restart backend container
        run: |
          if docker ps --format '{{.Names}}' | grep -q '^tmi-attendance-cpu$'; then
            echo "Container running — restarting"
            docker compose -f /home/naval/face-attendance-edu/backend/docker-compose.gpu.yml restart
          else
            echo "Container not running — building and starting"
            docker compose -f /home/naval/face-attendance-edu/backend/docker-compose.gpu.yml up -d --build
          fi